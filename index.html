<!doctype html>
<html lang="en" class="site">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Borrowly">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="borrowly-icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Borrowly | Rent what you need, from people nearby</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the deck's yellow slide as a desk, notes on the left, a life-size phone on the right.
   On a real phone (or from the Home Screen) the app fills the whole screen instead.
   Single light theme on purpose: it has to match the team's slides. */
:root{
  --yellow:#F2EE5C; --yellow-soft:#FBF8C8; --red:#E5401D; --red-press:#C7330F;
  --ink:#151513; --ink-2:#56554E; --ink-3:#8E8D84; --line:#E7E6DF; --fill:#F4F3EE;
  --white:#FFFFFF; --green:#1E8A4C;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--yellow);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg{display:block}
p{margin:0;line-height:1.45}

/* ---------- desk + notes panel ---------- */
.stage{min-height:100%;display:grid;grid-template-columns:minmax(0,370px) auto;justify-content:center;align-items:center;gap:64px;padding-block:24px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage::before{content:"";position:fixed;left:0;top:0;bottom:0;width:14px;background:var(--red)}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.wordmark{font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:-.035em;line-height:1;display:flex;align-items:center;gap:10px}
.wordmark .brand-mark{width:54px;height:54px;object-fit:contain;flex:none;border-radius:12px}
.lede{font-size:17px;line-height:1.45;max-width:32ch}
.meta{font-size:13px;color:var(--ink-2);line-height:1.5}
.panel h2{font-size:11px;letter-spacing:.11em;text-transform:uppercase;margin:0 0 6px;color:var(--ink-2);font-weight:700}
.flows{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.flow ol{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.flow button{width:100%;display:flex;gap:8px;align-items:center;background:none;border:0;padding:6px 8px;border-radius:9px;text-align:left;font-size:13.5px;font-weight:600}
.flow .n{font-variant-numeric:tabular-nums;width:21px;height:21px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.flow button:hover{background:rgba(21,21,19,.07)}
.flow button.on{background:var(--ink);color:var(--yellow)}
.tests{display:grid;gap:6px}
.test{display:block;width:100%;text-align:left;background:rgba(255,255,255,.55);border:0;border-radius:12px;padding:9px 12px;font-size:13px;line-height:1.4;color:var(--ink-2)}
.test:hover{background:rgba(255,255,255,.85)}
.test b{color:var(--ink);font-size:13.5px}
.reset{align-self:flex-start;background:none;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.reset:hover{background:var(--ink);color:var(--yellow)}
@media (max-width:899px){
  .stage{grid-template-columns:minmax(0,1fr);justify-items:center;gap:32px}
  .panel{order:2;max-width:440px;width:100%}
}

/* ---------- phone frame ---------- */
.holder{width:calc(414px * var(--s,1));height:calc(868px * var(--s,1));flex:none}
.phone{width:414px;height:868px;transform:scale(var(--s,1));transform-origin:0 0;background:#111;border-radius:66px;padding:12px;box-shadow:inset 0 0 0 2px #333,0 34px 60px -24px rgba(80,60,0,.5),0 10px 24px rgba(80,60,0,.18)}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--white);isolation:isolate;--top:50px;--bottom:22px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:30}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:6px 32px 0 50px;font-weight:700;font-size:16px;z-index:20}
.sbar .icons{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--ink);z-index:30;pointer-events:none}
.views{position:absolute;top:var(--top);left:0;right:0;bottom:0;overflow:hidden}

/* full-screen on a phone */
body.full{background:var(--white)}
body.full .stage{display:block;padding:0;min-height:0;height:100%}
body.full .stage::before,body.full .panel,body.full .island,body.full .sbar,body.full .homebar{display:none}
body.full .holder,body.full .phone,body.full .screen{width:100%;height:100%}
body.full .phone{transform:none;padding:0;border-radius:0;box-shadow:none;background:var(--white)}
body.full .screen{border-radius:0;--top:0px;--bottom:6px}
html.site body.full .screen{--top:env(safe-area-inset-top,0px);--bottom:max(6px,env(safe-area-inset-bottom,0px))}

/* screenshot mode (?shot) */
html.shot,html.shot body{background:transparent}
body.shot .stage{display:block;padding:0;min-height:0}
body.shot .stage::before,body.shot .panel,body.shot .toast{display:none}
body.shot .phone{box-shadow:inset 0 0 0 2px #333}

/* ---------- app views ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--white)}
.top{display:flex;align-items:center;gap:4px;padding:4px 10px;min-height:52px;flex:none}
.top .ttl{flex:1;text-align:center;font-weight:700;font-size:16px}
.spacer{width:40px;flex:none}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:none;border:0;position:relative;flex:none}
.ib:active{background:var(--fill)}
.ib .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--white)}
.ib.fav-on{color:var(--red)} .ib.fav-on svg{fill:currentColor}
.logo{background:none;border:0;display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.035em;padding:0 10px}
.logo .brand-mark{width:28px;height:28px;object-fit:contain;flex:none;border-radius:7px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 20px 28px;display:flex;flex-direction:column;gap:22px;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.body > *{flex-shrink:0}
.foot{flex:none;padding:12px 20px calc(10px + var(--bottom));border-top:1px solid var(--line);background:var(--white);display:flex;gap:10px}
.tabbar{flex:none;display:flex;justify-content:space-around;padding:6px 12px var(--bottom);border-top:1px solid var(--line);background:var(--white)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 18px 2px}
.tab.on{color:var(--red)}

.eyebrow{font-size:14px;color:var(--ink-2);font-weight:500}
h1{font-size:28px;line-height:1.12;letter-spacing:-.03em;font-weight:800;margin:0;text-wrap:balance}
h3{margin:0;font-size:20px;line-height:1.15;letter-spacing:-.02em;font-weight:800}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0;display:flex;justify-content:space-between;align-items:baseline}
.link{color:var(--red);font-weight:700;letter-spacing:0;text-transform:none;font-size:13px;background:none;border:0;padding:0}
.muted{color:var(--ink-2)} .small{font-size:12.5px} .d{display:block;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
b{font-weight:700}

.btn{flex:1;height:54px;border-radius:15px;border:0;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;transition:transform .1s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.red{background:var(--red);color:#fff} .btn.red:active{background:var(--red-press)}
.btn.split{justify-content:space-between}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{background:#ECEBE5;color:var(--ink-3);cursor:not-allowed;transform:none}
.btn.sm{height:40px;font-size:14px;border-radius:12px;flex:none;padding:0 16px}
.btn.sm.grow{flex:1}

.card{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--white)}
.soft{background:var(--yellow-soft);border-radius:16px;padding:14px}
.soft .i,.strip .i,.chip .i{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:600;white-space:nowrap;border:0}
.chip.pick{border:1.5px solid var(--line);background:var(--white);padding:7px 13px}
.chip.pick.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pricetag{background:var(--yellow);font-weight:800;font-size:14px;padding:5px 10px;border-radius:9px;white-space:nowrap;flex:none}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:var(--ink)}
.av.sm{width:32px;height:32px;font-size:11px}
.av.lg{width:64px;height:64px;font-size:20px}
.thumb{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none;display:block}
.thumb.sm{width:44px;height:44px;border-radius:11px}
.thumb > svg,.hero-art > svg,.nart > svg,.hero-img > svg,.slot > svg:not(.i){width:100%;height:100%}
.ic-badge{width:40px;height:40px;border-radius:12px;background:var(--fill);display:grid;place-items:center;flex:none}
.divider{height:1px;background:var(--line)}

/* home */
.loc{display:flex;align-items:center;gap:4px;background:none;border:0;padding:0;font-size:14px;font-weight:600;color:var(--ink-2)}
.loc .i:first-child{color:var(--red)}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:14px;background:var(--fill);padding:0 14px;color:var(--ink-3);font-size:14px;border:0;width:100%;text-align:left}
.hero{background:var(--yellow);border-radius:22px;padding:18px 0 18px 18px;display:grid;grid-template-columns:1fr 128px;gap:6px;align-items:end;overflow:hidden}
.hero-art{height:118px;border-radius:14px 0 0 14px;overflow:hidden}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{background:var(--fill);border:0;border-radius:16px;padding:14px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600}
.near{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ncard{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.nart{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;margin-bottom:4px;max-width:100%}
.fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--white);display:grid;place-items:center}
.fav.on{color:var(--red)} .fav.on svg{fill:currentColor}
.strip{display:flex;gap:10px;align-items:center;background:var(--yellow-soft);border-radius:14px;padding:12px 14px;font-size:13px;border:0;text-align:left;width:100%;line-height:1.4}

/* plan */
.dates{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{flex:none;width:62px;padding:10px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--white);display:flex;flex-direction:column;align-items:center;gap:1px}
.date b{font-size:21px;font-variant-numeric:tabular-nums}
.date.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:18px;padding:10px}
.stp{width:48px;height:48px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center}
.stp[disabled]{opacity:.35;cursor:not-allowed}
.stp-n{display:flex;flex-direction:column;align-items:center}
.stp-n b{font-size:34px;line-height:1.05;font-weight:800;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:12px;width:100%;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.opt.on{border-color:var(--ink)}
.box{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--ink-3);display:grid;place-items:center;flex:none}
.opt.on .box{background:var(--ink);border-color:var(--ink);color:#fff}

/* bundle */
.mapbox{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{width:100%;height:auto}
.irow{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
.irow:last-child{border-bottom:0}


/* Occasion-based planner and configurable bundle */
.occasion-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.occasion{display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left;background:var(--fill);border:1.5px solid var(--line);border-radius:16px;padding:12px;min-height:74px}
.occasion b{font-size:13px}.occasion .small{font-size:11px}
.occasion.on{background:var(--yellow-soft);border-color:var(--red)}
.hint{font-size:12px;line-height:1.4;color:var(--ink-2)}
.bundle-intro{background:var(--yellow-soft);border-radius:16px;padding:14px}
.bundle-intro h3{font-size:19px;margin:4px 0}
.filter-box{border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:9px}
.filter-box .chips{gap:5px}.filter-box .chip.pick{font-size:11px;padding:6px 9px}
.bundle-line{display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}
.bundle-line:last-child{border:0}.bundle-line .thumb{width:52px;height:52px}
.micro{border:1px solid var(--line);border-radius:9px;background:var(--white);font-size:12px;font-weight:700;padding:7px 10px}
.micro.accent{color:var(--red);border-color:var(--red)}
.bundle-total{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700}
.bundle-total strong{font-size:23px}
.swap-card{border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px}
.swap-card.on{border-color:var(--red);background:var(--yellow-soft)}
.swap-card .thumb{width:72px;height:72px}
.swap-card .btn{height:34px;font-size:12px;padding:0 12px;border-radius:10px}
.note{font-size:11px;color:var(--ink-3);line-height:1.4}
/* Marketplace */
.top-market{display:inline-flex;align-items:center;gap:5px;background:var(--fill);border:0;border-radius:12px;padding:9px 10px;font-size:12px;font-weight:700}
.market-search{display:flex;align-items:center;gap:9px;background:var(--fill);border-radius:14px;padding:10px 12px}
.market-search input{min-width:0;width:100%;border:0;outline:0;background:transparent;font:inherit;font-size:14px;color:var(--ink)}
.market-cats{display:flex;flex-wrap:wrap;gap:7px}
.market-results{display:flex;flex-direction:column;gap:10px}
.market-card{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:11px}
.market-card .thumb{width:72px;height:78px;border-radius:12px}
.market-actions{display:flex;align-items:center;flex-wrap:wrap;gap:7px}
.market-banner{display:flex;align-items:center;gap:10px;background:var(--yellow-soft);border-radius:16px;padding:13px}
.market-empty{background:var(--fill);border-radius:16px;text-align:center;padding:24px 12px}
.custom-field{width:100%;height:45px;border:1.5px solid var(--line);border-radius:13px;font:inherit;font-size:14px;padding:0 12px}
.planner-helper{background:var(--yellow-soft);border:1px dashed var(--red);border-radius:13px;padding:13px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:700}
/* item */
.hero-img{position:relative;aspect-ratio:16/10;border-radius:20px;overflow:hidden;max-width:100%;flex:none}
.badge-ins{position:absolute;top:12px;left:12px;background:var(--yellow);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center}
.count{position:absolute;bottom:10px;right:10px;background:rgba(21,21,19,.6);color:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700}
.chg{position:absolute;bottom:10px;right:10px;background:var(--white);border:0;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700;display:flex;gap:6px;align-items:center}
.review{margin:0;background:var(--fill);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45}
.review cite{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:6px}

/* coverage */
.cov-hero{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cov-ic{width:64px;height:64px;border-radius:20px;background:var(--yellow);display:grid;place-items:center;color:var(--red)}
.fact{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.fact .ic-badge{background:var(--yellow-soft);color:var(--red)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:14px;line-height:1.4;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}

/* checkout */
.choice{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:14px;background:var(--white)}
.choice.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;margin-top:1px;display:grid;place-items:center}
.choice.on .radio{border:7px solid var(--ink)}
.prices{display:flex;flex-direction:column;gap:9px;font-size:14px}
.prices .pr{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.prices .total{border-top:1px solid var(--line);padding-top:10px;font-weight:800;font-size:17px}
.ok-t{color:var(--green);font-weight:700}

/* booked */
.bk-card{background:var(--ink);color:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center}
.thumbs{display:flex}
.thumbs .thumb{border:2px solid var(--ink)}
.thumbs .thumb + .thumb{margin-left:-14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;position:relative;padding-bottom:16px}
.tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::before{display:none}
.dotx{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--white);display:grid;place-items:center}
.tl li.done .dotx{background:var(--red);border-color:var(--red);color:#fff}
.tl li.next .dotx{border:3px solid var(--red)}
.tl b{display:block;font-size:14px}
.tl span.s{font-size:12px;color:var(--ink-2)}
.tl time{font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.code{font-size:20px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.bubble{background:var(--fill);border-radius:4px 16px 16px 16px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:40px 10px}

/* return */
.slot-w{display:flex;flex-direction:column;align-items:center;gap:4px}
.slot{width:64px;height:64px;border-radius:12px;border:1.5px dashed var(--ink-3);display:grid;place-items:center;background:var(--fill);position:relative;overflow:hidden;flex:none;padding:0;color:var(--ink-2)}
.slot.filled{border:0}
.ok{position:absolute;right:4px;bottom:4px;width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.stars{display:flex}
.star{background:none;border:0;padding:3px;color:#D5D3CA}
.star.on{color:#E8A400} .star.on svg{fill:currentColor}

/* lender */
.mode{background:var(--fill);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;margin-right:6px}
.big{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.req{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--yellow);border:0;border-radius:18px;padding:14px;font-size:14px}
.chart text{font-family:var(--ui);font-size:10.5px;fill:var(--ink-3);font-weight:600}
.chart .v{fill:var(--ink);font-weight:800;font-size:11.5px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--white);font-size:12.5px;font-weight:700;padding:0}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700}
.field input{height:50px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--white)}
.field input:focus{border-color:var(--ink);outline:none}
.sw{width:50px;height:30px;border-radius:999px;background:#D9D8D1;border:0;position:relative;flex:none;transition:background .2s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(20px)}
.ava-head{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:calc(92px + var(--bottom));background:var(--ink);color:#fff;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;z-index:40;transform:translateY(16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;line-height:1.35}
.toast .i{color:var(--yellow);flex:none}
.toast.show{opacity:1;transform:none}

/* transitions */
.in-r{animation:inR .34s cubic-bezier(.2,.8,.2,1) both;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.out-l{animation:outL .34s cubic-bezier(.2,.8,.2,1) both}
.in-l{animation:inL .34s cubic-bezier(.2,.8,.2,1) both}
.out-r{animation:outR .34s cubic-bezier(.2,.8,.2,1) both;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.in-f{animation:fadeIn .22s ease both}
.out-f{animation:fadeOut .22s ease both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{to{transform:translateX(-28%)}}
@keyframes inL{from{transform:translateX(-28%)}to{transform:none}}
@keyframes outR{to{transform:translateX(100%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.in-r,.out-l,.in-l,.out-r,.in-f,.out-f{animation-duration:1ms}.toast{transition:none}}

        if(score<bestScore){bestScore=score;best=o;}
      });

    });
    S.swaps=picks;
  }

function chart(){

  const bars = WEEKS.map(([lab, v], i) => {
    const x = 30 + i * 80 + 18, bh = base - y(v), last = i === WEEKS.length - 1;
    return `<rect x="${x}" y="${y(v)}" width="44" height="${bh}" rx="6" fill="${last ? '#E5401D' : '#151513'}"/>
      <text class="v" x="${x+22}" y="${y(v)-6}" text-anchor="middle">$${v}</text>
      <text x="${x+22}" y="${base+16}" text-anchor="middle">${lab}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} 132" role="img" aria-label="Earnings by week: ${WEEKS.map(w => w[0]+' $'+w[1]).join(', ')}">${grid}${bars}</svg>`;
}

const FLOW_B = [['home','Home'],['plan','Plan an event'],['bundle','Recommended bundle'],['market','Marketplace'],['item','Item and lender'],['coverage','Coverage'],['checkout','Checkout'],['booked','Booked'],['ret','Return and rate']];
const FLOW_L = [['earnings','Earnings'],['request','Approve a request'],['list','List an item']];
const JUMP = {
  home:['home'], market:['home','market'], plan:['home','plan'], bundle:['home','plan','bundle'], item:['home','plan','bundle','item'],
  swap:['home','plan','bundle','swap'], coverage:['home','plan','bundle','coverage'], checkout:['home','plan','bundle','checkout'],
  booked:['booked'], ret:['booked','ret'], earnings:['earnings'], request:['earnings','request'], list:['earnings','list'],
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const views = document.getElementById('views');
let stack = ['home'], cur = null;

function show(name, dir){
  const el = document.createElement('section');
  el.className = 'view'; el.dataset.screen = name; el.innerHTML = V[name]();
  const old = cur; views.appendChild(el); cur = el;
  if (old) {
    old.style.pointerEvents = 'none';
    if (dir && !reduce) {
      const [a, b] = {fwd:['in-r','out-l'], back:['in-l','out-r'], fade:['in-f','out-f']}[dir];
      if (dir === 'back') old.style.zIndex = 2;
      el.classList.add(a); old.classList.add(b);
      setTimeout(() => old.remove(), 360);
    } else old.remove();
  }
  try { history.replaceState(null, '', location.pathname + location.search + '#' + name); } catch (e) {}
  syncPanel();
}
function rerender(){
  if (!cur) return;
  const b = cur.querySelector('.body'), st = b ? b.scrollTop : 0;
  cur.innerHTML = V[cur.dataset.screen]();
  const nb = cur.querySelector('.body'); if (nb) nb.scrollTop = st;
}
const go = n => { stack.push(n); show(n, 'fwd'); };
const back = () => { if (stack.length > 1) { stack.pop(); show(stack.at(-1), 'back'); } };
const tab = n => {
 if(n==='market'){S.marketMode='browse';S.marketCat='all';S.marketSearch='';S.preview=null;}
 if(stack.at(-1)===n&&stack.length===1){rerender();return;}
 stack=[n];show(n,'fade');
};
function ensureBooking(){
  if (S.booked) return;
  const ks = selected().length ? selected() : ['table','chairs'];
  S.booked = {items:ks, occasion:S.occasion, customOccasion:S.customOccasion, delivery:S.delivery, date:S.date, people:S.people, total:sub(ks) + (S.delivery ? 12 : 0)};
}
function jump(n){
  if (!JUMP[n]) n = 'home';
  if (n === 'booked' || n === 'ret') ensureBooking();
  if (n === 'item' && !S.item) S.item = 'table';
  stack = JUMP[n].slice(); show(n, cur ? 'fade' : null);
}

let tt;
function toast(msg, icon = 'check'){
  const t = document.getElementById('toast');
  t.innerHTML = `${ic(icon,18)}<span>${msg}</span>`; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600);
}

const A = {
  go, back, tab, jump,
  occasion:v=>{ S.occasion=v; S.need=Object.fromEntries(ORDER.map(k=>[k,OCCASIONS[v].defaults.includes(k)])); S.swaps={}; rerender(); },
  budget:v=>{ S.budget=Math.max(15,Math.min(200,S.budget+Number(v))); rerender(); },
  makebundle:()=>{recommend();go('bundle');},
  priority:v=>{ S.priority=v; recommend(); rerender(); },
  radius:v=>{ S.radius=Number(v); recommend(); rerender(); },
  ratingfilter:()=>{ S.minRating=S.minRating===4.8?0:4.8; recommend(); rerender(); },
  browse:v=>{
  S.marketMode='browse';S.marketCat=ORDER.includes(v)?v:'all';S.marketSearch='';S.preview=null;
  if(cur&&cur.dataset.screen==='market')rerender();else go('market');
 },
 swap:v=>{S.item=v;S.marketMode='swap';S.marketCat=v;S.marketSearch='';S.preview=null;go('market');},
 marketcat:v=>{if(S.marketMode==='swap'&&v!==S.marketCat)S.marketMode='browse';S.marketCat=v;rerender();},
 marketdetails:v=>{
  const [k,raw]=v.split(':'),i=Number(raw);if(!ITEMS[k]||!listings(k)[i])return;
  S.preview={k,index:i};S.item=k;go('item');
 },
 marketpick:v=>{
  const [k,raw]=v.split(':'),i=Number(raw),it=ITEMS[k]&&listings(k)[i];
  if(!it||!available(it))return;
  S.need[k]=true;S.swaps[k]=i;S.preview=null;
  stack=['home','plan','bundle'];show('bundle','fwd');toast(ITEMS[k].short+' added to your bundle');
 },
 viewbundle:()=>{S.preview=null;stack=['home','plan','bundle'];show('bundle','fwd');},

  choose:v=>{ const i=Number(v),k=S.item,it=listings(k)[i]; if(!it||!eligible(it))return; S.swaps[k]=i; back(); },
  remove:v=>{ S.need[v]=false; delete S.swaps[v]; rerender(); },
  item: v => { S.item=v; S.preview={k:v,index:0}; go('item'); },
  toast: v => toast(v, 'info'),
  reset: () => { S = fresh(); stack = ['home']; show('home', cur ? 'fade' : null); },
  fav: v => { S.fav[v] = !S.fav[v]; rerender(); if (S.fav[v]) toast('Saved to your list', 'heart'); },
  date: v => { S.date = v; rerender(); },
  people: v => { S.people = Math.min(8, Math.max(2, S.people + Number(v))); rerender(); },
  need: v => { S.need[v] = !S.need[v]; delete S.swaps[v]; rerender(); },
  add: v => A.marketpick(v+':'+(Number.isInteger(S.swaps[v])?S.swaps[v]:0)),
  deliv: v => { S.delivery = v === 'runner'; rerender(); },
  pay: () => {
    const ks = selected(), ls = lendersOf(ks);
    S.booked = {items:ks, occasion:S.occasion, customOccasion:S.customOccasion, delivery:S.delivery, date:S.date, people:S.people, total:sub(ks) + (S.delivery ? 12 : 0)};
    S.ret = {}; S.rate = {};
    stack = ['booked']; show('booked', 'fwd');
    toast(`${firsts(ls)} approved your request`);
  },
  photo: v => { S.ret[v] = true; rerender(); },
  rate: v => { const [l, n] = v.split(':'); S.rate[l] = Number(n); rerender(); },
  finish: () => { S.booked = null; S.ret = {}; S.rate = {}; stack = ['home']; show('home', 'fade'); toast('Returned. Your $100 hold is released.'); },
  accept: () => { S.request = 'accepted'; stack = ['earnings']; show('earnings', 'back'); toast('Accepted. Ava picks up Sunday at 6 PM.'); },
  decline: () => { S.request = 'declined'; stack = ['earnings']; show('earnings', 'back'); toast('Declined. We’ll suggest other lenders to Ava.', 'info'); },
  lcat: v => { S.lcat = v; rerender(); },
  lprice: v => { S.lprice = Math.min(30, Math.max(2, S.lprice + Number(v))); rerender(); },
  lday: v => { S.ldays = S.ldays.includes(v) ? S.ldays.filter(d => d !== v) : [...S.ldays, v]; rerender(); },
  lobby: () => { S.lobby = !S.lobby; rerender(); },
  publish: () => { S.listed = true; stack = ['earnings']; show('earnings', 'back'); toast('Listed. Neighbors can book it now.'); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.closest('.view') && t.closest('.view') !== cur) return;
  e.preventDefault(); e.stopPropagation();
  const f = A[t.dataset.act]; if (f) f(t.dataset.v, t);
});
document.addEventListener('keydown', e => {
  const t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute && t.getAttribute('role') === 'button') { e.preventDefault(); t.click(); }
});
document.addEventListener('input',e=>{
 if(e.target.id==='lname')S.lname=e.target.value;
 if(e.target.id==='customOccasion')S.customOccasion=e.target.value;
 if(e.target.id==='marketSearch'){
  S.marketSearch=e.target.value;
  const result=document.getElementById('marketResults');
  if(result)result.innerHTML=marketMarkup();
 }
});
document.addEventListener('gesturestart', e => e.preventDefault());

/* ---------- side panel ---------- */
const flowList = (items, start) => items.map(([k, l], i) => `<li><button data-act="jump" data-v="${k}" data-k="${k}"><span class="n">${start + i}</span>${l}</button></li>`).join('');
document.getElementById('flowB').innerHTML = flowList(FLOW_B, 1);
document.getElementById('flowL').innerHTML = flowList(FLOW_L, FLOW_B.length + 1);
function syncPanel(){
  const n = cur && cur.dataset.screen;
  document.querySelectorAll('.flow button').forEach(b => b.classList.toggle('on', b.dataset.k === n));
}

/* ---------- layout mode ---------- */
const root = document.documentElement, body = document.body;
const isShot = /(^|[?&])shot\b/.test(location.search);
if (isShot) { root.classList.add('shot'); body.classList.add('shot'); }
function fit(){
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  // A phone gets the bare app at any orientation: narrow screens, touch devices with a phone-sized screen, or launched from the Home Screen.
  const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 500;
  const full = !isShot && (innerWidth <= 520 || phone || standalone || /(^|[?&])app\b/.test(location.search));
  body.classList.toggle('full', full);
  let s = 1;
  if (!full && !isShot) {
    const wide = innerWidth >= 900;
    const availW = wide ? innerWidth - 370 - 64 - 60 : innerWidth - 40;
    s = Math.min(1, (innerHeight - 48) / 868, availW / 414);
    s = Math.max(.5, s);
  }
  root.style.setProperty('--s', s.toFixed(3));
}
addEventListener('resize', fit);
fit();
jump((location.hash || '#home').slice(1));
})();
</script>
